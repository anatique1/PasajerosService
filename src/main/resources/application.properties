spring.application.name=pasajero
server.port=8082
spring.data.mongodb.uri=${PASAJEROS_MONGODB_URI:mongodb://localhost:27017/pasajeros}
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Swagger UI: http://localhost:8082/swagger-ui.html  |  JSON: http://localhost:8082/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
